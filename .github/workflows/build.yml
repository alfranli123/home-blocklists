name: Build block lists

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build lists (fails without changing anything on a bad download or a suspicious list)
        run: python3 build.py

      - name: Commit only if the list changed
        run: |
          if git diff --quiet -- lists/; then
            echo "No change in lists/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lists/
          git commit -m "Update block lists $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
